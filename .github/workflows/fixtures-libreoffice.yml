# Temporary: generates the LibreOffice reader fixtures for JSE-6 and uploads
# them as an artifact. Removed again before the PR is final.
name: LibreOffice fixtures
on:
  push:
    branches: [jse-6-reader]
    paths:
      - packages/javascript-excel/test/fixtures/read/generate_libreoffice.sh
      - .github/workflows/fixtures-libreoffice.yml
permissions:
  contents: read
jobs:
  generate:
    name: Generate LibreOffice fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install LibreOffice Calc (headless)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-calc-nogui
          soffice --version
      - name: Python tools (openpyxl)
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet openpyxl==3.1.5
      - name: Generate
        env:
          JSE_PYTHON: ${{ runner.temp }}/py/bin/python
        run: packages/javascript-excel/test/fixtures/read/generate_libreoffice.sh "$RUNNER_TEMP/lo-fixtures"
      - uses: actions/upload-artifact@v7
        with:
          name: libreoffice-fixtures
          path: ${{ runner.temp }}/lo-fixtures
